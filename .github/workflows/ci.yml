name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm build && pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y podman-compose
      - run: podman compose up -d --build
      - name: Wait for instances and verify collaboration
        run: |
          curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://localhost:4001/healthz
          curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://localhost:4002/healthz
          curl --retry 15 --retry-connrefused --retry-delay 2 --fail http://localhost:3000/
          pnpm test:integration
          pnpm test:e2e
      - if: failure()
        run: podman compose logs
      - if: always()
        run: podman compose down -v

services:
  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "127.0.0.1:${MERGEPAD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: mergepad
      POSTGRES_USER: mergepad
      POSTGRES_PASSWORD: mergepad
    ports:
      - "127.0.0.1:${MERGEPAD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mergepad", "-d", "mergepad"]
      interval: 2s
      timeout: 2s
      retries: 20
  server-a:
    image: localhost/mergepad-server:local
    build:
      context: .
      dockerfile: apps/server/Containerfile
    environment: &server-env
      DATABASE_URL: postgres://mergepad:mergepad@postgres:5432/mergepad
      REDIS_URL: redis://redis:6379
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      INSTANCE_ID: server-a
    depends_on: &dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4001:4000"
    restart: on-failure
  server-b:
    image: localhost/mergepad-server:local
    environment:
      <<: *server-env
      INSTANCE_ID: server-b
    depends_on: *dependencies
    pull_policy: never
    ports:
      - "127.0.0.1:4002:4000"
    restart: on-failure
  web:
    image: localhost/mergepad-web:local
    build:
      context: .
      dockerfile: apps/web/Containerfile
  gateway:
    image: docker.io/library/nginx:1.28-alpine
    depends_on: [web, server-a, server-b]
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    ports:
      - "127.0.0.1:${MERGEPAD_PORT:-3000}:8080"
    restart: on-failure

volumes:
  postgres-data:
